<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-v="B">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Sistemas — VX Case</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#121216;--surface:#1a1a20;--surface2:#22222a;--border:#2e2e38;--border2:#444452;--text:#f5f5f7;--text2:#a8a8b3;--text3:#777784;--accent:#6366f1;--accent-h:#4f46e5;--accent-soft:rgba(99,102,241,.14);--star:#fbbf24;}
html[data-theme="light"]{--bg:#f4f5f8;--surface:#fff;--surface2:#eef0f4;--border:#e4e6ec;--border2:#cfd2dc;--text:#191a20;--text2:#565863;--text3:#868a97;--accent:#5457e6;--accent-h:#4245cf;--accent-soft:rgba(84,87,230,.1);--star:#d99a06;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;transition:background .25s,color .25s;}
button{font-family:inherit;color:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px;}
.top{padding:30px 0 22px;display:flex;align-items:flex-start;gap:16px;}
.brand{flex:1;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px;}
.title{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-bottom:5px;}
.title span{color:var(--accent);}
.subtitle{color:var(--text2);font-size:14px;}
.theme-toggle{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
.theme-toggle:hover{border-color:var(--border2);color:var(--text);}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,color .15s;}
.btn:hover{border-color:var(--border2);color:var(--text);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff;}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px;}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 14px;}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;padding:11px 0;}
.search kbd{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);border:1px solid var(--border);border-radius:5px;padding:1px 6px;}
.count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);}
.sec{margin-bottom:28px;}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.sec-h h2{font-size:13px;font-weight:700;letter-spacing:.2px;}
.sec-h small{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);}
.star{background:none;border:0;cursor:pointer;font-size:17px;line-height:1;color:var(--text3);opacity:.55;padding:4px;border-radius:6px;transition:opacity .15s,color .15s,transform .15s;}
.star:hover{opacity:1;transform:scale(1.15);}
.star.on{color:var(--star);opacity:1;}
.ico{display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;background:var(--surface2);padding:3px 8px;border-radius:5px;white-space:nowrap;}
.empty{color:var(--text3);font-size:13.5px;padding:30px 0;}
.foot{color:var(--text3);font-size:12px;text-align:center;padding:10px 0 40px;}
.hidden{display:none!important;}

/* usuários */
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:50px;}
.user-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s;}
.user-card:hover{border-color:var(--border2);transform:translateY(-2px);}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
.user-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.user-meta{font-size:12px;color:var(--text3);}

/* ===== VARIANTE A: cards por categoria ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s,box-shadow .15s;}
.card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.18);}
.card .ico{width:42px;height:42px;border-radius:11px;font-size:21px;}
.card .star{position:absolute;top:12px;right:12px;}
.card-name{font-size:14.5px;font-weight:700;letter-spacing:-.2px;margin-bottom:3px;}
.card-desc{font-size:12.5px;color:var(--text3);line-height:1.5;}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--border);}
.card .go{color:var(--text3);transition:transform .15s;}
.card:hover .go{transform:translate(2px,-2px);color:var(--text);}

/* ===== VARIANTE B: lista compacta ===== */
.rows{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.row{display:flex;align-items:center;gap:14px;padding:11px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--border);transition:background .12s;}
.row:last-child{border-bottom:0;}
.row:hover,.row.sel{background:var(--surface2);}
.row .ico{width:34px;height:34px;border-radius:9px;font-size:17px;}
.row-main{flex:1;min-width:0;}
.row-name{font-size:14px;font-weight:700;}
.row-desc{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .go{color:var(--text3);font-size:14px;}
html[data-v="B"] .wrap{max-width:860px;}

/* edição */
.picker-cat{margin-bottom:22px;}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px;}
.pick{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer;}
.pick:hover{border-color:var(--border2);}
.pick input{width:17px;height:17px;accent-color:var(--accent);}
.pick .pn{font-size:13.5px;font-weight:600;}
@media (max-width:640px){.wrap{padding:0 16px}.top{flex-wrap:wrap}.title{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="eyebrow">VX Case · Operações</div>
      <div class="title" id="pageTitle">Painel de <span>Sistemas</span></div>
      <div class="subtitle" id="pageSub">Escolha o usuário para abrir os sistemas</div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"><span id="themeIco">☀️</span><span id="themeTxt">Tema claro</span></button>
  </div>
  <div id="view"></div>
  <div class="foot">Painel interno · Acesso restrito à equipe</div>
</div>

<script>
/* ===================== DADOS ===================== */
const CATS = [
  {id:'logistica', nome:'Estoque e logística'},
  {id:'tampografia', nome:'Tampografia'},
  {id:'gestao', nome:'Gestão e pessoas'}
];
const SISTEMAS = [
  {id:'analista-tampografia', cat:'tampografia', nome:'Analista Tampografia', desc:'Tela de operação para analistas da tampografia', url:'https://admvxcase2026-creator.github.io/tampografia/analista.html', ico:'👤', bg:'#3d2c00', cor:'#fcd34d', tag:'Sistema'},
  {id:'controle-codigos', cat:'logistica', nome:'Controle de Códigos', desc:'Desativação e reativação controlada de códigos de produto', url:'https://admvxcase2026-creator.github.io/desativa-es/controle-reativacoes.html', ico:'🔢', bg:'#1e2a47', cor:'#93c5fd', tag:'Sistema'},
  {id:'controle-excedentes', cat:'logistica', nome:'Controle de Excedentes', desc:'Registro de excedentes de expedição, com métricas', url:'https://admvxcase2026-creator.github.io/Excedentes/', ico:'🧾', bg:'#3d2c00', cor:'#fcd34d', tag:'Sistema'},
  {id:'demandas', cat:'gestao', nome:'Demandas', desc:'Gestão e acompanhamento de demandas internas', url:'https://admvxcase2026-creator.github.io/demandas/', ico:'📋', bg:'#3b1212', cor:'#fca5a5', tag:'Sistema'},
  {id:'devolucao', cat:'logistica', nome:'Devolução', desc:'Movimentos de devolução por loja e recebimento no estoque', url:'https://admvxcase2026-creator.github.io/devolu-es/painel-devolucao.html', ico:'↩️', bg:'#3b1212', cor:'#fca5a5', tag:'Sistema'},
  {id:'distribuicao', cat:'logistica', nome:'Distribuição', desc:'Controle de chegada, liberação e distribuição de produtos', url:'https://admvxcase2026-creator.github.io/distribui-o/', ico:'🚚', bg:'#14302a', cor:'#4ade80', tag:'Sistema'},
  {id:'estoque-tampografia', cat:'tampografia', nome:'Estoque Tampografia', desc:'Controle de estoque vinculado à tampografia', url:'https://admvxcase2026-creator.github.io/tampografia/estoque.html', ico:'📦', bg:'#14302a', cor:'#4ade80', tag:'Sistema'},
  {id:'fardacontrol', cat:'gestao', nome:'FardaControl', desc:'Gestão de uniformes e fardamentos da equipe', url:'https://admvxcase2026-creator.github.io/fardamentos/fardamentos.html', ico:'👔', bg:'#4b1528', cor:'#f4a3c1', tag:'Login próprio'},
  {id:'informativo-estoque', cat:'logistica', nome:'Informativo de Estoque', desc:'Aviso às lojas sobre indisponibilidade e substitutos', url:'https://admvxcase2026-creator.github.io/informativos/', ico:'🔔', bg:'#412402', cor:'#fbbf24', tag:'Sistema'},
  {id:'protocolo-saida', cat:'logistica', nome:'Protocolo de Saída', desc:'Registro e rastreio de saídas de estoque', url:'https://admvxcase2026-creator.github.io/protocoloestoque/registro.html', ico:'✅', bg:'#1e2a47', cor:'#93c5fd', tag:'Senha'},
  {id:'remanejamento', cat:'logistica', nome:'Remanejamento', desc:'Controle de remanejamento de produtos entre lojas', url:'https://admvxcase2026-creator.github.io/remanejamento/', ico:'🔄', bg:'#3d2c00', cor:'#fcd34d', tag:'Sistema'},
  {id:'tampografia', cat:'tampografia', nome:'Quotes Tampografia', desc:'Gestão de impressão e processos de tampografia', url:'https://admvxcase2026-creator.github.io/tampografia/tampografia.html', ico:'🖨️', bg:'#1e2a47', cor:'#93c5fd', tag:'Sistema'},
  {id:'transferencia', cat:'logistica', nome:'Solicitações em Loja', desc:'Registro rápido de transferências entre pontos de venda', url:'https://admvxcase2026-creator.github.io/mensagenswpp/', ico:'🔁', bg:'#3d2c00', cor:'#fcd34d', tag:'Sistema'}
].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

const USUARIOS = [
  {id:'geral',   nome:'Geral',           todos:true,  bg:'#1e2a47', cor:'#93c5fd'},
  {id:'amanda',  nome:'Amanda Menezes',  todos:false, bg:'#4b1528', cor:'#f4a3c1'},
  {id:'felipe',  nome:'Felipe Santana',  todos:false, bg:'#14302a', cor:'#4ade80'},
  {id:'raquel',  nome:'Raquel França',   todos:false, bg:'#3d2c00', cor:'#fcd34d'},
  {id:'suiane',  nome:'Suiane Lopes',    todos:false, bg:'#3b1212', cor:'#fca5a5'},
  {id:'tarsila', nome:'Tarsila Estrela', todos:false, bg:'#2a1f4d', cor:'#c4b5fd'}
];

/* ===================== ESTADO ===================== */
const VARIANTE = document.documentElement.dataset.v;
const $ = id => document.getElementById(id);
const ls = {
  get(k, d){ try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let user = null, query = '', editing = false;
const ids = () => SISTEMAS.map(s => s.id);
const getSel = u => (ls.get('vxhub-sel-' + u.id, null) || ids()).filter(i => ids().includes(i));   // ignora sistemas removidos
const getFav = u => ls.get('vxhub-fav-' + u.id, []).filter(i => ids().includes(i));
const getRec = u => ls.get('vxhub-rec-' + u.id, []).filter(i => ids().includes(i));
const lista = u => { const sel = u.todos ? ids() : getSel(u); return SISTEMAS.filter(s => sel.includes(s.id)); };
const iniciais = n => { const p = n.trim().split(/\s+/); return (p.length > 1 ? p[0][0] + p[1][0] : p[0].slice(0, 2)).toUpperCase(); };
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function setHead(eyebrowTitle, sub){ $('pageTitle').innerHTML = eyebrowTitle; $('pageSub').textContent = sub; }

/* ===================== TELAS ===================== */
function telaUsuarios(){
  user = null; query = ''; editing = false;
  setHead('Painel de <span>Sistemas</span>', 'Escolha o usuário para abrir os sistemas');
  $('view').innerHTML = '<div class="users">' + USUARIOS.map(u => {
    const q = u.todos ? SISTEMAS.length : getSel(u).length;
    return `<button class="user-card" data-user="${u.id}"><div class="avatar" style="background:${u.bg};color:${u.cor}">${iniciais(u.nome)}</div>
      <div><div class="user-name">${u.nome}</div><div class="user-meta">${u.todos ? 'Todos os sistemas' : q + (q === 1 ? ' sistema' : ' sistemas')}</div></div></button>`;
  }).join('') + '</div>';
}

function itemHtml(s, fav){
  const star = `<button class="star ${fav ? 'on' : ''}" data-fav="${s.id}" title="${fav ? 'Tirar dos favoritos' : 'Favoritar'}" aria-label="Favoritar ${s.nome}">${fav ? '★' : '☆'}</button>`;
  const ico = `<div class="ico" style="background:${s.bg};color:${s.cor}">${s.ico}</div>`;
  if(VARIANTE === 'B') return `<a class="row" data-open="${s.id}" href="${s.url}" target="_blank" rel="noopener">${ico}
    <div class="row-main"><div class="row-name">${s.nome}</div><div class="row-desc">${s.desc}</div></div><span class="tag">${s.tag}</span>${star}<span class="go">↗</span></a>`;
  return `<a class="card" data-open="${s.id}" href="${s.url}" target="_blank" rel="noopener">${star}${ico}
    <div><div class="card-name">${s.nome}</div><div class="card-desc">${s.desc}</div></div>
    <div class="card-foot"><span class="tag">${s.tag}</span><span class="go">↗</span></div></a>`;
}
const wrapList = h => VARIANTE === 'B' ? `<div class="rows">${h}</div>` : `<div class="cards">${h}</div>`;

function telaSistemas(){
  editing = false;
  const u = user, todos = lista(u), fav = getFav(u);
  setHead(u.todos ? 'Todos os <span>Sistemas</span>' : `Sistemas de <span>${u.nome.split(' ')[0]}</span>`,
          u.todos ? 'Lista completa das ferramentas internas' : 'Ferramentas selecionadas por este usuário');
  $('view').innerHTML = `<div class="bar">
      <button class="btn" id="btnVoltar">← Trocar usuário</button>
      <label class="search"><span>🔍</span><input id="busca" type="search" placeholder="Buscar sistema" autocomplete="off" value="${query.replace(/"/g, '&quot;')}"><kbd>/</kbd></label>
      ${u.todos ? '' : '<button class="btn btn-primary" id="btnEditar">✎ Editar sistemas</button>'}
      <span class="count" id="cont"></span></div><div id="conteudo"></div>`;
  $('btnVoltar').onclick = telaUsuarios;
  if(!u.todos) $('btnEditar').onclick = telaEditar;
  $('busca').oninput = e => { query = e.target.value; renderConteudo(); };
  $('busca').onkeydown = e => { if(e.key === 'Enter'){ const a = $('conteudo').querySelector('[data-open]'); if(a) window.open(a.href, '_blank', 'noopener'); } if(e.key === 'Escape'){ e.target.value = ''; query = ''; renderConteudo(); } };
  renderConteudo();
}

function renderConteudo(){
  const u = user, todos = lista(u), fav = getFav(u), rec = getRec(u);
  const q = norm(query.trim());
  const match = s => !q || norm(s.nome + ' ' + s.desc).includes(q);
  const vis = todos.filter(match);
  $('cont').textContent = q ? vis.length + ' de ' + todos.length : todos.length + ' de ' + SISTEMAS.length;
  let h = '';
  if(!todos.length){ $('conteudo').innerHTML = '<div class="empty">Nenhum sistema selecionado. Clique em <b>Editar sistemas</b> para escolher.</div>'; return; }
  if(!vis.length){ $('conteudo').innerHTML = '<div class="empty">Nada encontrado para “' + query.replace(/</g, '&lt;') + '”.</div>'; return; }
  const sec = (titulo, arr, n) => arr.length ? `<div class="sec"><div class="sec-h"><h2>${titulo}</h2><small>${arr.length}</small></div>${wrapList(arr.map(s => itemHtml(s, fav.includes(s.id))).join(''))}</div>` : '';
  if(!q){
    h += sec('★ Favoritos', todos.filter(s => fav.includes(s.id)));
    h += sec('Abertos recentemente', rec.map(i => todos.find(s => s.id === i)).filter(Boolean).slice(0, 4));
  }
  CATS.forEach(c => { h += sec(c.nome, vis.filter(s => s.cat === c.id)); });
  $('conteudo').innerHTML = h;
}

function telaEditar(){
  editing = true;
  const u = user, sel = getSel(u);
  setHead(`Sistemas de <span>${u.nome.split(' ')[0]}</span>`, 'Marque os sistemas que devem aparecer na tela de ' + u.nome.split(' ')[0]);
  $('view').innerHTML = `<div class="bar"><button class="btn btn-primary" id="btnSalvar">Salvar</button><button class="btn" id="btnCancelar">Cancelar</button><button class="btn" id="btnTodos">Marcar todos</button><button class="btn" id="btnNenhum">Limpar</button></div>` +
    CATS.map(c => `<div class="picker-cat"><div class="sec-h"><h2>${c.nome}</h2></div><div class="picks">` +
      SISTEMAS.filter(s => s.cat === c.id).map(s => `<label class="pick"><input type="checkbox" value="${s.id}" ${sel.includes(s.id) ? 'checked' : ''}><span>${s.ico}</span><span class="pn">${s.nome}</span></label>`).join('') + '</div></div>').join('');
  const boxes = () => $('view').querySelectorAll('input[type=checkbox]');
  $('btnTodos').onclick = () => boxes().forEach(b => b.checked = true);
  $('btnNenhum').onclick = () => boxes().forEach(b => b.checked = false);
  $('btnCancelar').onclick = telaSistemas;
  $('btnSalvar').onclick = () => { ls.set('vxhub-sel-' + u.id, Array.from(boxes()).filter(b => b.checked).map(b => b.value)); telaSistemas(); };
}

/* ===================== EVENTOS ===================== */
$('view').addEventListener('click', e => {
  const uc = e.target.closest('.user-card');
  if(uc){ user = USUARIOS.find(u => u.id === uc.dataset.user); query = ''; telaSistemas(); return; }
  const st = e.target.closest('[data-fav]');
  if(st){
    e.preventDefault(); e.stopPropagation();
    let f = getFav(user); const id = st.dataset.fav;
    f = f.includes(id) ? f.filter(x => x !== id) : [id].concat(f);
    ls.set('vxhub-fav-' + user.id, f); renderConteudo(); return;
  }
  const op = e.target.closest('[data-open]');
  if(op && user){ const id = op.dataset.open; ls.set('vxhub-rec-' + user.id, [id].concat(getRec(user).filter(x => x !== id)).slice(0, 6)); }
});
document.addEventListener('keydown', e => {
  if(e.key === '/' && !editing && user && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); const b = $('busca'); if(b) b.focus(); }
});

/* ===================== TEMA ===================== */
(function(){
  const root = document.documentElement, K = 'vxhub-theme';
  function apply(t){ root.setAttribute('data-theme', t); try{ localStorage.setItem(K, t); }catch(e){} $('themeIco').textContent = t === 'light' ? '🌙' : '☀️'; $('themeTxt').textContent = t === 'light' ? 'Tema escuro' : 'Tema claro'; }
  let saved; try{ saved = localStorage.getItem(K); }catch(e){}
  if(!saved) saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  apply(saved);
  $('themeToggle').onclick = () => apply(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
})();
telaUsuarios();
</script>
</body>
</html>
